name: 아침 알림
on:
  schedule:
    - cron: "52 22 * * *"   # 매일 07:52 (한국 시간). GitHub가 보통 몇 분 늦게 돌려서 8시쯤 도착해요
    - cron: "25 23 * * *"   # 혹시 첫 번째가 안 돌았을 때를 위한 예비 (하루 한 번만 보내도록 서버가 막아요)
  workflow_dispatch:
jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: 오늘 일정·할 일 알림 보내기
        run: |
          curl -sS -X POST "https://tufmtipzfrynqavzpkvo.supabase.co/functions/v1/family-push" \
            -H "content-type: application/json" -H "x-region: ap-northeast-2" \
            -d '{"action":"morning"}'
