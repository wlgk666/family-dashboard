name: 알림 서버 자동 배포
# main 에 supabase/functions 가 바뀌어 들어오면 Supabase 의 family-push 함수를 저절로 다시 올려요.
# 처음 한 번만: GitHub 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 넣어 주세요.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 확인
        id: tok
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN 이 아직 없어서 배포를 건너뛰어요."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == 'true'
        with: { version: latest }
      - name: family-push 배포
        if: steps.tok.outputs.ok == 'true'
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: supabase functions deploy family-push --project-ref tufmtipzfrynqavzpkvo --no-verify-jwt --use-api --yes
